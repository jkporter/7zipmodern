# Builds and tests 7-Zip for Windows 11 (CPP/Windows11) for x64 and arm64, and publishes a
# GitHub release named after the 7-Zip version, with files named like the ones on
# https://www.7-zip.org/download.html (7z2604-x64.exe -> 7z2604-win11-x64.msix).
#
# A release is created on the default branch when no release exists yet for the engine version
# in C/7zVersion.h, i.e. after a "Update to 7-Zip XX.YY" pull request from the
# windows11-upstream workflow is merged. Run it manually with a revision to re-release the same
# 7-Zip version (tag 26.04-r1, MSIX version 26.4.1.0).
#
# Optional settings (repository Settings > Secrets and variables > Actions):
#   secret   MSIX_CERTIFICATE           base64 of a .pfx code signing certificate
#   secret   MSIX_CERTIFICATE_PASSWORD  its password
#   variable MSIX_PUBLISHER             package publisher; default: the certificate subject,
#                                       or Package.appxmanifest's when unsigned
#   variable ARM64_RUNNER               runner for arm64 (default windows-11-arm; set it to
#                                       windows-latest to cross-compile without running tests)

name: Windows 11 release

on:
  push:
    branches: [main, master]
    paths:
      - 'Asm/**'
      - 'C/**'
      - 'CPP/**'
      - '.github/scripts/**'
      - '.github/workflows/windows11-release.yml'
  pull_request:
    paths:
      - 'Asm/**'
      - 'C/**'
      - 'CPP/**'
      - '.github/scripts/**'
      - '.github/workflows/windows11-release.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision: 0 for the first release of a 7-Zip version, 1, 2, ... to re-release it'
        type: number
        default: 0
      publish:
        description: 'Create the GitHub release (default branch only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows11-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.repo.outputs.version }}
      short: ${{ steps.repo.outputs.short }}
      revision: ${{ steps.release.outputs.revision }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - id: repo
        shell: pwsh
        run: .github/scripts/Get-7ZipVersion.ps1 -Source Repo >> $env:GITHUB_OUTPUT

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.repo.outputs.version }}
          REVISION: ${{ inputs.revision || 0 }}
          WANT_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          ON_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          tag="$VERSION"
          if [ "$REVISION" != "0" ]; then tag="$VERSION-r$REVISION"; fi
          publish=false
          if [ "$WANT_PUBLISH" = "true" ] && [ "$ON_DEFAULT_BRANCH" = "true" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::Release $tag already exists; building without publishing."
            else
              publish=true
            fi
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "7-Zip $VERSION for Windows 11: tag $tag, publish $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: ${{ vars.ARM64_RUNNER || 'windows-11-arm' }}
    runs-on: ${{ matrix.runner }}
    env:
      CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
      CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
      PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v5

      # The Windows App SDK / C++/WinRT packages the build script installs with nuget.exe
      - uses: actions/cache@v4
        with:
          path: out/packages
          key: windows11-nuget-${{ hashFiles('CPP/Windows11/Windows11.mak') }}

      - name: Build, test and package
        shell: pwsh
        run: |
          $arguments = @{ Arch = '${{ matrix.arch }}'; Revision = ${{ needs.version.outputs.revision }}; OutDir = 'out' }
          if ($env:CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
            $arguments.CertificatePath = $pfx
            $arguments.CertificatePassword = $env:CERTIFICATE_PASSWORD
            if (-not $env:PUBLISHER) {
              $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:CERTIFICATE_PASSWORD)
              $env:PUBLISHER = $cert.Subject
            }
          }
          if ($env:PUBLISHER) { $arguments.Publisher = $env:PUBLISHER }
          .github/scripts/Build-Windows11.ps1 @arguments

      - name: Remove the certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows11-${{ matrix.arch }}
          path: |
            out/*.msix
            out/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows11-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHORT: ${{ needs.version.outputs.short }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNED: ${{ secrets.MSIX_CERTIFICATE != '' }}
        run: |
          cd dist
          sha256sum *.msix *.zip > SHA256SUMS.txt
          if [ "$SIGNED" = "true" ]; then
            install="Double-click the \`.msix\` for your PC (x64 or arm64) to install it."
          else
            install="The \`.msix\` packages are **not signed**: install the publisher's certificate as trusted, or enable Developer Mode and use \`Add-AppxPackage -AllowUnsigned\`."
          fi
          cat > ../notes.md <<EOF
          7-Zip $VERSION for Windows 11: the 7-Zip $VERSION engine (\`7z.dll\`, unchanged) with the WinUI 3 front end from \`CPP/Windows11\`.

          Upstream release: [7-Zip $VERSION](https://github.com/ip7z/7zip/releases/tag/$VERSION) · [what's new](https://www.7-zip.org/history.txt) · [download page](https://www.7-zip.org/download.html)

          | File | System | Description |
          |---|---|---|
          | 7z$SHORT-win11-x64.msix | Windows 11 x64 | App package: Explorer context menu, file associations, Share target |
          | 7z$SHORT-win11-arm64.msix | Windows 11 arm64 | App package |
          | 7z$SHORT-win11-x64.zip | Windows 11 x64 | Unpackaged app (needs the [Windows App Runtime](https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads) 2.5) |
          | 7z$SHORT-win11-arm64.zip | Windows 11 arm64 | Unpackaged app |

          $install

          Both the packages and the unpackaged app need the Windows App Runtime 2.5.
          EOF
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "7-Zip $VERSION for Windows 11" \
            --notes-file ../notes.md
